; Автоматическая лампа в ванной. Общий код для RP2040-Zero, ESP32-C3, ESP32-C6 (ESP32 - добавить при получении плат).
; Ядро RP2040 - arduino-pico (Earle Philhower) через платформу maxgerhardt: в официальной платформе raspberrypi
; ядро Arduino Mbed OS, в нём нет BOOTSEL и платы RP2040-Zero.
; Прошивка: BOOT + RESET, копирование firmware.uf2 на диск RPI-RP2.

[env]
framework = arduino
lib_deps = adafruit/Adafruit NeoPixel@1.15.5
build_src_flags = -Wall -Wstrict-aliasing=1   ; только свои исходники (ядро и SDK с ними шумят)
extra_scripts = post:../Scripts/copy_firmware.py

[rp2040]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = waveshare_rp2040_zero
board_build.core = earlephilhower

; Рабочая сборка: консоль настройки по USB только при включении, затем USB выключен, 12 МГц от кварца, сон SLEEP
[env:rp2040zero]
extends = rp2040

[env:rp2040zero_night]
extends = rp2040
build_flags = -DNIGHT_LIGHT   ; ночник: COB 5 В через P75N02LDG, ШИМ на GP4

; Отладка: USB-CDC с журналом (монитор порта 115200), частота и сон по умолчанию
[env:rp2040zero_debug]
extends = rp2040
build_flags = -DDEBUG_LOG
monitor_speed = 115200
