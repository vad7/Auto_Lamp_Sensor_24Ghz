; Тест WS2812B на Waveshare RP2040-Zero (скетч RP2040.ino в этой же папке - собирается и в Arduino IDE).
; Ядро arduino-pico (Earle Philhower) - через платформу maxgerhardt: в официальной платформе raspberrypi
; ядро Arduino Mbed OS, в нём нет BOOTSEL и платы RP2040-Zero.
; Сборка: pio run   |   прошивка: pio run -t upload (или BOOT + RESET и копирование .uf2 на диск RPI-RP2)

[platformio]
src_dir = .

[env:rp2040zero]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = waveshare_rp2040_zero
framework = arduino
board_build.core = earlephilhower
lib_deps = adafruit/Adafruit NeoPixel@1.15.5
; USB отключён - минимальное потребление; прошивка: BOOT + RESET, затем pio run -t upload
build_flags = -DPIO_FRAMEWORK_ARDUINO_NO_USB

; Плата «RP2040 Purple» без схемы: общая плата Pico - универсальный boot2 (W25Q080) под неизвестную флеш-память;
; кварц 12 МГц (иначе не работал бы загрузчик USB - даташит RP2040, табл. выводов XIN/XOUT). WS2812B на GP16 может
; не быть - тест только на ток покоя.
[env:purple]
extends = env:rp2040zero
board = rpipico
